# logstash-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline-config
  namespace: elk
data:
  logstash.conf: |
    input {
      tcp {
        port => 5044
        codec => json
      }
    }

    filter {
       mutate {
          add_field => { "application" => "demo" }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "api-logs-%{+YYYY.MM.dd}"
      }
      stdout { codec => rubydebug }
    }
