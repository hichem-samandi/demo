input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "application"   => "demo"
      "service_type"  => "rest-api"
      "environment"   => "dev"
    }
  }

  # Only grok if the "message" field exists AND contains "http"
  if ([message] and [message] =~ /http/) {
    grok {
      match => {
        "message" => [
          "%{WORD:method} %{URIPATHPARAM:endpoint} %{NUMBER:status:int} %{NUMBER:duration:int}ms"
        ]
      }
      tag_on_failure => ["grok_parse_failure"]
    }
  }

  mutate {
    convert => {
      "duration" => "integer"
      "status"   => "integer"
    }
  }

  if ([status] and [status] >= 400) {
    mutate { add_field => { "error" => "true" } }
  } else {
    mutate { add_field => { "error" => "false" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "demo-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
